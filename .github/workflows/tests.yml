name: Testes

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lua 5.1 e luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Sintaxe Lua 5.1
        run: bash tests/check-syntax.sh

      - name: Testes
        run: lua5.1 tests/run.lua tests/spec/*.lua

      - name: Lint
        run: luacheck . --no-color
