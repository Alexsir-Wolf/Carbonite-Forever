name: Release

# Gera o zip com todas as pastas Carbonite* e publica a release no GitHub,
# de onde o WowUp e outros gerenciadores instalam e atualizam o addon.
#
# So tags da numeracao propria da edicao (ex.: v1.0.0) disparam a release.
# Tags do upstream (ex.: v12.1.0-00023) tem sufixo e nao casam com o filtro.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest

    # Criar a release e anexar o zip exige escrita no repositorio.
    permissions:
      contents: write

    env:
      # Sempre disponivel: publica a release no GitHub (zip + release.json).
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # Opcionais. Sem o secret (ou sem o id do projeto no .toc), o packager
      # pula o envio para o site e a release no GitHub sai normalmente.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Clonar o projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historico e tags para a versao e o changelog

      - name: Empacotar e publicar
        uses: BigWigsMods/packager@v2
        with:
          args: -n "Carbonite-Forever-{project-version}"
